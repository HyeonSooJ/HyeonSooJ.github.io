<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="바이낸스 SOXLUSDT 상장일부터 하루치 3분봉 차트 보기 — 전체·월별·요일별·날짜별">
<title>SOXL 3분봉 일자별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 위 = 선택한 날(기본: 최신일) 큰 3분봉 차트 / 가운데 = 보기 버튼(전체·월별·요일별·날짜) / 아래 = 고른 날들의 미니 차트 격자 */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#14171c; --muted:#6a7280; --line:#e2e5ea; --chip:#eef0f3;
  --up:#d6283a; --down:#1f5fd1; --sel:#14171c; --wick:#9aa1ad;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --panel:#161a20; --fg:#e8ebf0; --muted:#8b93a1; --line:#262c35; --chip:#1f242c;
  --up:#ff5468; --down:#4d8dff; --sel:#e8ebf0; --wick:#5c6470; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#161a20; --fg:#e8ebf0; --muted:#8b93a1; --line:#262c35; --chip:#1f242c;
  --up:#ff5468; --down:#4d8dff; --sel:#e8ebf0; --wick:#5c6470; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 20px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13px}
.dhead .date{font-family:var(--mono);font-weight:600;font-size:16px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.kv{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.kv b{color:var(--fg);font-weight:600}
.chg{font-family:var(--mono);font-weight:600}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.nav{margin-left:auto;display:flex;gap:6px}
button,select,input{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px}
button{cursor:pointer} button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.bigwrap{position:relative;height:clamp(300px,64vh,760px)}
#big{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chipbtn{background:var(--chip);border-color:transparent;padding:5px 10px}
.chipbtn.on,#allBtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select.on,input.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
#allBtn{font-weight:600}
.gridhead{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.gridhead .title{color:var(--fg);font-weight:600;font-size:13px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,68px),1fr));gap:4px}
.cell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;cursor:pointer;padding:0;height:var(--ch,50px);overflow:hidden}
.cell.m1{border-left:2px solid var(--muted)}
.cell canvas{width:100%;height:100%;display:block}
.cell .lb{position:absolute;left:3px;top:1px;font-family:var(--mono);font-size:var(--fs,9px);color:var(--muted);line-height:1.15;pointer-events:none}
.cell .pc{position:absolute;right:3px;top:1px;font-family:var(--mono);font-size:var(--fs,9px);font-weight:600;line-height:1.15;pointer-events:none}
.cell.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.note a{color:inherit}
@media (max-width:600px){.bigwrap{height:clamp(260px,52vh,420px)}.nav{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <h1>SOXLUSDT 3분봉</h1>
  <span class="sub" id="range"></span>
</header>

<section class="detail" aria-label="선택한 날 3분봉 차트">
  <div class="dhead">
    <span class="date" id="dDate"></span>
    <span class="badge" id="dBadge" hidden>최신</span>
    <span class="chg" id="dChg"></span>
    <span class="kv" id="dKv"></span>
    <div class="nav">
      <button id="prev" type="button" aria-label="이전 날">◀ 이전 날</button>
      <button id="next" type="button" aria-label="다음 날">다음 날 ▶</button>
    </div>
  </div>
  <div class="bigwrap"><canvas id="big"></canvas><div id="tip" hidden></div></div>
</section>

<section class="tools" aria-label="차트 모아보기">
  <button id="allBtn" type="button">전체 보기</button>
  <div class="grp">
    <span class="lbl">월별</span>
    <select id="monthSel" aria-label="월 선택"><option value="">월 선택</option></select>
  </div>
  <div class="grp" id="wdGrp">
    <span class="lbl">요일별</span>
  </div>
  <div class="grp">
    <span class="lbl">특정 날짜</span>
    <input type="date" id="dateIn" aria-label="날짜 선택">
  </div>
</section>

<section id="gridSec" hidden>
  <div class="gridhead">
    <span class="title" id="gTitle"></span>
    <span>칸을 누르면 위 차트가 그날로 바뀝니다</span>
    <span><i class="sw" style="background:var(--up)"></i>상승 마감</span>
    <span><i class="sw" style="background:var(--down)"></i>하락 마감</span>
    <span>점선 = 시가 · 굵은 왼쪽 선 = 매월 1일</span>
  </div>
  <div id="grid" style="margin-top:8px"></div>
</section>

<div class="note">출처: Binance USDⓈ-M 선물 SOXLUSDT 3분봉 공식 아카이브(data.binance.vision). 하루 = 한국시간 09:00 ~ 익일 08:57 봉. 상장 2026-05-15 23:00 KST. 요일은 그날 09:00(한국시간) 기준. · <a href="SOXL_3m.xlsx">엑셀 다운로드</a></div>

<script src="data.js"></script>
<script>
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const WD=['일','월','화','수','목','금','토'];
const dayInfo=DAYS.map(([d,st,a])=>{const n=a.length/5;let h=-1,l=1e12,hi=0,li=0;
  for(let i=0;i<n;i++){if(a[i*5+1]>h){h=a[i*5+1];hi=i}if(a[i*5+2]<l){l=a[i*5+2];li=i}}
  const [y,m,dd]=d.split('-').map(Number);const wd=new Date(Date.UTC(y,m-1,dd)).getUTCDay();
  return {d,st,a,n,o:a[0],c:a[(n-1)*5+3],h,l,hi,li,wd,m:d.slice(0,7)}});
const LAST=dayInfo.length-1;
const tm=k=>{const m=(9*60+k*3)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const p=x=>(x/100).toFixed(2);
const pct=x=>(x.c/x.o-1)*100;
let sel=LAST;
document.getElementById('range').textContent=`상장 ${dayInfo[0].d} ~ ${dayInfo[LAST].d} · ${dayInfo.length}일 · ${dayInfo.reduce((s,x)=>s+x.n,0).toLocaleString()}봉`;

function setup(cv){const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dp));cv.height=Math.max(1,Math.round(r.height*dp));
  const g=cv.getContext('2d');g.setTransform(dp,0,0,dp,0,0);return [g,r.width,r.height]}

/* ---------- big chart ---------- */
const big=document.getElementById('big'),tip=document.getElementById('tip');let geo=null;
function niceStep(r,n){const s=r/n,m=Math.pow(10,Math.floor(Math.log10(s))),f=s/m;return (f<1.5?1:f<3?2:f<7?5:10)*m}
function drawBig(){const x=dayInfo[sel];const [g,W,H]=setup(big);g.clearRect(0,0,W,H);
  const L=6,R=56,T=10,B=22,pw=W-L-R,ph=H-T-B;const pad=(x.h-x.l)*.04||1,hi=x.h+pad,lo=x.l-pad;
  const Y=v=>T+(hi-v)/(hi-lo)*ph,bw=pw/480,X=k=>L+(k+.5)*bw;
  const fg=css('--fg'),mu=css('--muted'),ln=css('--line'),up=css('--up'),dn=css('--down');
  g.font='11px '+css('--mono');g.textBaseline='middle';g.lineWidth=1;
  const st=niceStep(hi-lo,6);for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){const y=Math.round(Y(v))+.5;g.strokeStyle=ln;g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillStyle=mu;g.textAlign='left';g.fillText(p(v),L+pw+6,y)}
  g.textAlign='center';g.textBaseline='top';const step=W<600?80:40;
  for(let k=0;k<=480;k+=step){const xx=Math.round(L+k*bw)+.5;g.strokeStyle=ln;g.beginPath();g.moveTo(xx,T);g.lineTo(xx,T+ph);g.stroke();g.fillStyle=mu;g.fillText(k<480?tm(k):'09:00',Math.max(L+16,Math.min(xx,L+pw-14)),T+ph+6)}
  for(let i=0;i<x.n;i++){const a=x.a,o=a[i*5],h=a[i*5+1],l=a[i*5+2],c=a[i*5+3],k=i+x.st;
    const xx=X(k);g.fillStyle=c>=o?up:dn;g.fillRect(Math.round(xx-.5),Y(h),1,Math.max(1,Y(l)-Y(h)));
    const w=Math.max(1,bw*.7),y1=Y(Math.max(o,c)),y2=Y(Math.min(o,c));g.fillRect(xx-w/2,y1,w,Math.max(1,y2-y1))}
  g.strokeStyle=mu;g.setLineDash([3,3]);g.beginPath();g.moveTo(L,Math.round(Y(x.o))+.5);g.lineTo(L+pw,Math.round(Y(x.o))+.5);g.stroke();g.setLineDash([]);
  g.textBaseline='middle';g.font='600 11px '+css('--mono');
  [[x.hi,x.h,-1,'고 '],[x.li,x.l,1,'저 ']].forEach(([i,v,dir,t])=>{const xx=X(i+x.st),y=Y(v)+dir*10;g.fillStyle=fg;const right=xx>L+pw-110;g.textAlign=right?'right':'left';g.fillText(t+p(v)+' '+tm(i+x.st),xx+(right?-4:4),y)});
  geo={L,bw}}
function select(i,scroll){sel=Math.max(0,Math.min(LAST,i));const x=dayInfo[sel];
  cells.forEach(c=>c.el.classList.toggle('on',c.i===sel));
  document.getElementById('dDate').textContent=`${x.d} (${WD[x.wd]}) 09:00 ~ 익일 09:00`;
  document.getElementById('dBadge').hidden=sel!==LAST;
  const pc=pct(x),e=document.getElementById('dChg');e.textContent=(pc>=0?'+':'')+pc.toFixed(2)+'%';e.className='chg '+(pc>=0?'up':'down');
  document.getElementById('dKv').innerHTML=`시 <b>${p(x.o)}</b> 고 <b>${p(x.h)}</b> (${tm(x.hi+x.st)}) 저 <b>${p(x.l)}</b> (${tm(x.li+x.st)}) 종 <b>${p(x.c)}</b> · ${x.n}봉`;
  document.getElementById('prev').disabled=sel===0;document.getElementById('next').disabled=sel===LAST;
  drawBig();tip.hidden=true;
  if(scroll)document.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'start'})}
big.addEventListener('mousemove',ev=>{if(!geo)return;const r=big.getBoundingClientRect(),mx=ev.clientX-r.left;const x=dayInfo[sel];
  const k=Math.floor((mx-geo.L)/geo.bw),i=k-x.st;if(i<0||i>=x.n){tip.hidden=true;return}const a=x.a;
  tip.hidden=false;tip.textContent=`${tm(k)}  시 ${p(a[i*5])}  고 ${p(a[i*5+1])}  저 ${p(a[i*5+2])}  종 ${p(a[i*5+3])}  (${((a[i*5+3]/x.o-1)*100).toFixed(2)}%)`;
  const tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(r.width-tw,mx+12))+'px';tip.style.top='4px'});
big.addEventListener('mouseleave',()=>tip.hidden=true);
document.getElementById('prev').onclick=()=>select(sel-1);
document.getElementById('next').onclick=()=>select(sel+1);
addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowLeft'){select(sel-1);e.preventDefault()}if(e.key==='ArrowRight'){select(sel+1);e.preventDefault()}});

/* ---------- grid views ---------- */
const grid=document.getElementById('grid'),gridSec=document.getElementById('gridSec');let cells=[];
function drawMini(c){const x=dayInfo[c.i],cv=c.el.querySelector('canvas');const [g,W,H]=setup(cv);
  g.clearRect(0,0,W,H);const top=H>60?16:12,bot=2,ph=H-top-bot,rng=Math.max(1,x.h-x.l);
  const Y=v=>top+(x.h-v)/rng*ph;const up=css('--up'),dn=css('--down');
  const cols=Math.max(1,Math.floor(W-4)),per=480/cols,bw=Math.max(1,Math.floor(cols/480*0.8))||1;
  for(let col=0;col<cols;col++){const s0=Math.floor(col*per)-x.st,s1=Math.max(Math.floor((col+1)*per)-x.st,s0+1);
    let h=-1,l=1e12,o=null,cl=null;for(let k=Math.max(0,s0);k<Math.min(x.n,s1);k++){const a=x.a;if(o===null)o=a[k*5];cl=a[k*5+3];if(a[k*5+1]>h)h=a[k*5+1];if(a[k*5+2]<l)l=a[k*5+2]}
    if(o===null)continue;g.fillStyle=cl>=o?up:dn;const y1=Y(h),y2=Y(l);g.fillRect(2+col,y1,1,Math.max(1,y2-y1))}
  g.strokeStyle=css('--wick');g.setLineDash([2,2]);g.lineWidth=1;g.beginPath();g.moveTo(2,Math.round(Y(x.o))+.5);g.lineTo(W-2,Math.round(Y(x.o))+.5);g.stroke();g.setLineDash([])}
function showGrid(idx,title){gridSec.hidden=false;grid.innerHTML='';cells=[];
  const n=idx.length,root=document.documentElement.style;
  if(n>60){root.setProperty('--cw','68px');root.setProperty('--ch','50px');root.setProperty('--fs','9px')}
  else if(n>12){root.setProperty('--cw','130px');root.setProperty('--ch','84px');root.setProperty('--fs','10.5px')}
  else{root.setProperty('--cw','220px');root.setProperty('--ch','130px');root.setProperty('--fs','12px')}
  const pcs=idx.map(i=>pct(dayInfo[i])),ups=pcs.filter(v=>v>=0).length,avg=n?pcs.reduce((s,v)=>s+v,0)/n:0;
  document.getElementById('gTitle').textContent=n?`${title} · ${n}일 · 상승 ${ups} / 하락 ${n-ups} · 평균 ${avg>=0?'+':''}${avg.toFixed(2)}%`:title;
  if(!n){grid.innerHTML='<div class="empty">해당하는 날이 없습니다. 다른 조건을 골라 주세요.</div>';return}
  let lastM='';
  idx.forEach(i=>{const x=dayInfo[i],v=pct(x);const b=document.createElement('button');b.type='button';
    b.className='cell'+(x.m!==lastM&&n>60?' m1':'');lastM=x.m;
    const lab=n>60?`${+x.d.slice(5,7)}/${+x.d.slice(8)}`:`${+x.d.slice(5,7)}/${+x.d.slice(8)} (${WD[x.wd]})`;
    b.innerHTML=`<canvas></canvas><span class="lb">${lab}</span><span class="pc" style="color:var(${v>=0?'--up':'--down'})">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
    b.title=`${x.d} (${WD[x.wd]})  ${v>=0?'+':''}${v.toFixed(2)}%`;b.setAttribute('aria-label',b.title);
    b.onclick=()=>select(i,true);grid.appendChild(b);cells.push({el:b,i})});
  cells.forEach(c=>c.el.classList.toggle('on',c.i===sel));
  requestAnimationFrame(()=>{cells.forEach(drawMini);gridSec.scrollIntoView({behavior:'smooth',block:'start'})})}
const allIdx=dayInfo.map((_,i)=>i);
const allBtn=document.getElementById('allBtn'),monthSel=document.getElementById('monthSel'),dateIn=document.getElementById('dateIn'),wdGrp=document.getElementById('wdGrp');
function clearOn(){allBtn.classList.remove('on');monthSel.classList.remove('on');dateIn.classList.remove('on');wdGrp.querySelectorAll('.chipbtn').forEach(b=>b.classList.remove('on'))}
allBtn.onclick=()=>{clearOn();allBtn.classList.add('on');monthSel.value='';showGrid(allIdx,'전체')};
[...new Set(dayInfo.map(x=>x.m))].forEach(m=>{const o=document.createElement('option');o.value=m;const [y,mm]=m.split('-');o.textContent=`${y}년 ${+mm}월`;monthSel.appendChild(o)});
monthSel.onchange=()=>{if(!monthSel.value)return;clearOn();monthSel.classList.add('on');const [y,mm]=monthSel.value.split('-');
  showGrid(allIdx.filter(i=>dayInfo[i].m===monthSel.value),`${y}년 ${+mm}월`)};
[1,2,3,4,5,6,0].forEach(w=>{const b=document.createElement('button');b.type='button';b.className='chipbtn';b.textContent=WD[w];b.setAttribute('aria-label',WD[w]+'요일');
  b.onclick=()=>{clearOn();b.classList.add('on');monthSel.value='';showGrid(allIdx.filter(i=>dayInfo[i].wd===w),`${WD[w]}요일`)};wdGrp.appendChild(b)});
dateIn.min=dayInfo[0].d;dateIn.max=dayInfo[LAST].d;dateIn.value=dayInfo[LAST].d;
dateIn.onchange=()=>{const i=dayInfo.findIndex(x=>x.d===dateIn.value);clearOn();dateIn.classList.add('on');monthSel.value='';
  if(i<0){showGrid([],`${dateIn.value}: 데이터 없음 (${dayInfo[0].d} ~ ${dayInfo[LAST].d} 사이로 골라 주세요)`);return}
  select(i);showGrid([i],`${dateIn.value} (${WD[dayInfo[i].wd]})`)};

function redraw(){drawBig();cells.forEach(drawMini)}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(redraw,120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
select(LAST);
document.fonts&&document.fonts.ready.then(redraw);
</script>
</body>
</html>
