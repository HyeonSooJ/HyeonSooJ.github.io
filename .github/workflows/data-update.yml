# 차트 사이트(chart/) 데이터를 매일 자동으로 갱신합니다.
# 바이낸스 아카이브는 다음 날 08:00~13:00(UTC)쯤 올라오므로 매시간 확인하고,
# 새 날짜가 있을 때만 커밋합니다. Actions 탭에서 "Run workflow"로 바로 실행할 수도 있습니다.
name: SOXL KORU data update

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분(하루 24번). GitHub가 예약 실행을 가끔 건너뛰므로 자주 확인. 새 날짜 없으면 아무것도 안 함
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: soxl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new candles and stock prices
        run: |
          python .github/scripts/update_data.py chart/data/soxl SOXLUSDT SOXL
          python .github/scripts/update_data.py chart/data/koru KORUUSDT KORU

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/data
          if git diff --cached --quiet; then
            echo "새 데이터 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            LAST=$(python -c "import json;s=open('chart/data/soxl/data.js').read();print(json.loads(s[s.index('=')+1:].rstrip(';'))[-1][0])")
            git commit -m "SOXL/KORU data update through ${LAST}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재빌드 요청 실패(푸시로 자동 빌드되면 무시해도 됨)"
